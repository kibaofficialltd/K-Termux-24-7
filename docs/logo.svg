<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="K Termux 24/7 logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <pattern id="scan" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="2.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="11" y="11" width="490" height="490" rx="94" fill="none" stroke="#ff7a00" stroke-opacity="0.35" stroke-width="3"/>
  <rect width="512" height="512" rx="104" fill="url(#scan)"/>

  <!-- terminal prompt: > _ -->
  <path d="M78 84 L126 116 L78 148" fill="none" stroke="url(#or)" stroke-width="17" stroke-linecap="square"/>
  <rect x="146" y="106" width="64" height="17" fill="url(#or)"/>

  <!-- K monogram: blocky stem + chunky arms -->
  <rect x="128" y="158" width="66" height="266" fill="url(#or)"/>
  <path d="M194 291 L346 166" fill="none" stroke="url(#or)" stroke-width="60" stroke-linecap="square"/>
  <path d="M194 291 L346 406" fill="none" stroke="url(#or)" stroke-width="60" stroke-linecap="square"/>

  <!-- 24/7 -->
  <text x="256" y="474" text-anchor="middle" font-family="'DejaVu Sans Mono','Courier New',monospace"
        font-weight="bold" font-size="44" letter-spacing="6" fill="#f4f4f5">24/7</text>
</svg>
