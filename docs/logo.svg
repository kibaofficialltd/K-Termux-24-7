<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="K Termux 24/7 Ultimate logo">
  <defs>
    <linearGradient id="pu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#7B2BF0"/>
    </linearGradient>
  </defs>

  <!-- black background -->
  <rect width="1024" height="1024" fill="#050506"/>

  <!-- purple ring -->
  <circle cx="512" cy="512" r="462" fill="none" stroke="url(#pu)" stroke-width="44"/>

  <!-- orbit swoosh -->
  <ellipse cx="545" cy="415" rx="330" ry="150" fill="none" stroke="url(#pu)" stroke-width="25"
           transform="rotate(-14 545 415)"/>

  <!-- white terminal prompt > _ -->
  <path d="M356 300 L490 434 L356 568" fill="none" stroke="#ffffff" stroke-width="88"
        stroke-linecap="butt" stroke-linejoin="miter"/>
  <rect x="560" y="536" width="190" height="82" fill="#ffffff"/>

  <!-- wordmark: K Termux -->
  <text x="512" y="768" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold"
        font-size="138"><tspan fill="url(#pu)">K</tspan><tspan fill="#ffffff" dx="18">Termux</tspan></text>

  <!-- 24/7 with side dashes -->
  <line x1="252" y1="866" x2="352" y2="866" stroke="#8E4BF0" stroke-width="11"/>
  <line x1="672" y1="866" x2="772" y2="866" stroke="#8E4BF0" stroke-width="11"/>
  <text x="512" y="893" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold"
        font-size="100" fill="url(#pu)">24/7</text>

  <!-- ULTIMATE -->
  <text x="503" y="952" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold"
        font-size="44" letter-spacing="18" fill="#ffffff">ULTIMATE</text>
</svg>
