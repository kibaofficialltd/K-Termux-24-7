<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="K Termux 24/7 Ultimate banner">
  <defs>
    <linearGradient id="bpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#7B2BF0"/>
    </linearGradient>
  </defs>

  <!-- black background -->
  <rect width="1200" height="300" fill="#050506"/>

  <!-- icon tile -->
  <rect x="36" y="36" width="228" height="228" rx="46" fill="#0a0a0d" stroke="url(#bpu)" stroke-opacity="0.55" stroke-width="3"/>
  <!-- mini ring -->
  <circle cx="150" cy="150" r="96" fill="none" stroke="url(#bpu)" stroke-width="13"/>
  <!-- mini orbit -->
  <ellipse cx="154" cy="128" rx="80" ry="42" fill="none" stroke="url(#bpu)" stroke-width="8"
           transform="rotate(-15 154 128)"/>
  <!-- mini prompt -->
  <path d="M118 108 L158 148 L118 188" fill="none" stroke="#ffffff" stroke-width="22"
        stroke-linecap="butt" stroke-linejoin="miter"/>
  <rect x="172" y="138" width="46" height="20" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="322" y="152" font-family="DejaVu Sans" font-weight="bold" font-size="80"
        ><tspan fill="url(#bpu)">K</tspan><tspan fill="#ffffff" dx="12">TERMUX</tspan></text>
  <text x="322" y="238" font-family="DejaVu Sans" font-weight="bold" font-size="56"
        letter-spacing="2" fill="url(#bpu)">24/7 ULTIMATE</text>

  <!-- tagline -->
  <text x="1164" y="64" text-anchor="end" font-family="DejaVu Sans" font-weight="bold"
        font-size="24" letter-spacing="3" fill="#8f8f9a">★ KIBA OFFICIAL</text>
  <text x="1164" y="262" text-anchor="end" font-family="DejaVu Sans"
        font-size="23" letter-spacing="1" fill="#6a6a75">personal server · android · termux</text>
</svg>
